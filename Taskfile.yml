version: '3'

# Root Taskfile — orchestrates the shared tasks from Taskfile.lib.yml for each
# workspace module. The includes section maps every sub-workspace to the shared
# library so they all expose the same build, test, lint, and validate targets.
includes:
  # When adding a new workspace module, add an entry here pointing to
  # Taskfile.lib.yml with dir: set to the module directory.
  examples:
    dir: examples
  x-catalog-models:
    dir: x/catalog/models
  x-provider-anthropic:
    dir: x/provider/anthropic
  x-provider-minimax:
    dir: x/provider/minimax
  x-provider-mock:
    dir: x/provider/mock
  x-provider-mock-anthropic:
    dir: x/provider/mock/anthropic
  x-provider-mock-openai:
    dir: x/provider/mock/openai
  x-provider-openai:
    dir: x/provider/openai
  x-provider-openrouter:
    dir: x/provider/openrouter
  x-provider-vercel:
    dir: x/provider/vercel
  x-conduit:
    dir: x/conduit
  x-conduit-http:
    dir: x/conduit/http
  x-conduit-slack:
    dir: x/conduit/slack
  x-conduit-stdio:
    dir: x/conduit/stdio
  x-conduit-telegram:
    dir: x/conduit/telegram
  x-conduit-tui:
    dir: x/conduit/tui
  x-export:
    dir: x/export
  x-wire-anthropic:
    dir: x/wire/anthropic
  x-wire-openai:
    dir: x/wire/openai
  x-tool:
    dir: x/tool
  x-tool-bash:
    dir: x/tool/bash
  x-tool-calculator:
    dir: x/tool/calculator
  x-tool-filesystem:
    dir: x/tool/filesystem
  x-tool-mcp:
    dir: x/tool/mcp
  x-tool-sandbox-unsafe:
    dir: x/tool/sandbox/unsafe
  x-tool-set-model:
    dir: x/tool/set_model
  x-tool-skills:
    dir: x/tool/skills
  x-tool-truncate:
    dir: x/tool/truncate

tasks:
  setup:
    desc: Install required tools and dependencies
    cmds:
      - go mod download

  build:
    desc: Compile the application and all packages
    cmds:
      - go build ./...
      - go build ./examples/single-turn-cli

  test:
    desc: Run unit tests with race detection
    cmds:
      - go test -race ./...

  lint:
    desc: Run code linters
    cmds:
      - go vet ./...
      - golangci-lint run ./...

  generate:
    desc: Regenerate the model catalog and gateway lookup tables
    cmds:
      - go run ./cmd/modelsdev-gen
      # Re-run is a no-op if upstream is unchanged; the diff check below
      # fails the task if the second run rewrites anything.
      - go run ./cmd/modelsdev-gen
      - git diff --exit-code x/catalog/models/ x/provider/openrouter/lookup.go x/provider/vercel/lookup.go

  # ---------------------------------------------------------------------------
  # Validate the whole repository
  # ---------------------------------------------------------------------------
  validate:
    desc: Run lints, tests, and build across all workspace modules
    deps: [lint, test, build]
    cmds:
      - task examples:validate
      - task x-catalog-models:validate
      - task x-provider-anthropic:validate
      - task x-provider-minimax:validate
      - task x-provider-mock:validate
      - task x-provider-mock-anthropic:validate
      - task x-provider-mock-openai:validate
      - task x-provider-openai:validate
      - task x-provider-openrouter:validate
      - task x-provider-vercel:validate
      - task x-conduit:validate
      - task x-conduit-http:validate
      - task x-conduit-slack:validate
      - task x-conduit-stdio:validate
      - task x-conduit-telegram:validate
      - task x-conduit-tui:validate
      - task x-wire-anthropic:validate
      - task x-wire-openai:validate
      - task x-tool:validate
      - task x-tool-bash:validate
      - task x-tool-calculator:validate
      - task x-tool-filesystem:validate
      - task x-tool-mcp:validate
      - task x-tool-sandbox-unsafe:validate
      - task x-tool-set-model:validate
      - task x-tool-skills:validate
      - task x-tool-truncate:validate

  release:
    desc: Release all modules with pending changes
    cmds:
      - go run ./cmd/release all

  release-status:
    desc: Show pending module releases
    cmds:
      - go run ./cmd/release status

  # ---------------------------------------------------------------------------
  # Mock LLM server (used by the workshop and perf probes).
  # ---------------------------------------------------------------------------
  # Usage: task mock-server -- -vendor=openai -config=responses.json [-addr=:0]
  # Pass-through args are supported via {{.CLI_ARGS}} (task 3.50+).
  mock-server:
    desc: Run the wire-compatible mock LLM server (passes args through)
    cmds:
      - 'go run ./cmd/mock-server {{.CLI_ARGS}}'
